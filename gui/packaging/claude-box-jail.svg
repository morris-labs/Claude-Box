<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
  Alternative app icon: the Claude mark behind bars, which is the joke
  the whole project runs on — a box is a cell you put an agent in.

  Generated by packaging/make-jail-icon.py; edit that, not this. Drawn in
  gui/src/Theme.cpp's palette (window #1b1c1e, border #33353a, accent
  #d97757) so it matches the app it launches.

  The starburst is a stylized homage, not Anthropic's official mark;
  don't pass it off as the real logo.
  -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#5c626c"/>
      <stop offset="0.35" stop-color="#aab1bc"/>
      <stop offset="0.62" stop-color="#7e838d"/>
      <stop offset="1"    stop-color="#4a4f57"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="#1b1c1e"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="51.25" fill="none" stroke="#33353a" stroke-width="1.5"/>

  <!-- the cell behind the prisoner -->
  <rect x="34" y="34" width="188" height="188" rx="24" fill="#101113"/>
  <circle cx="128" cy="128" r="88" fill="url(#glow)"/>

  <!-- the Claude mark -->
  <g fill="#d97757">
    <path d="M 128.0 128.0 Q 161.4 130.4 213.0 105.2 Q 155.8 109.2 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 149.2 116.7 173.3 82.7 Q 139.3 106.8 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 146.8 100.2 150.8 43.0 Q 125.6 94.6 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 128.8 103.9 111.4 66.2 Q 115.3 107.6 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 113.4 97.8 65.8 65.8 Q 97.8 113.4 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 107.6 115.3 66.2 111.4 Q 103.9 128.8 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 94.6 125.6 43.0 150.8 Q 100.2 146.8 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 106.8 139.3 82.7 173.3 Q 116.7 149.2 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 109.2 155.8 105.2 213.0 Q 130.4 161.4 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 127.2 152.1 144.6 189.8 Q 140.7 148.4 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 142.6 158.2 190.2 190.2 Q 158.2 142.6 128.0 128.0 Z"/>
    <path d="M 128.0 128.0 Q 148.4 140.7 189.8 144.6 Q 152.1 127.2 128.0 128.0 Z"/>
  </g>

  <!-- bars: shadows first, so they fall across the mark and not the frame -->
  <g>
    <rect x="60" y="34" width="16" height="188" rx="8" fill="#000000" opacity="0.16"/>
    <rect x="104" y="34" width="16" height="188" rx="8" fill="#000000" opacity="0.16"/>
    <rect x="148" y="34" width="16" height="188" rx="8" fill="#000000" opacity="0.16"/>
    <rect x="192" y="34" width="16" height="188" rx="8" fill="#000000" opacity="0.16"/>
  </g>
  <g>
    <rect x="56" y="34" width="16" height="188" rx="8" fill="url(#steel)"/>
    <rect x="59.5" y="40" width="3.5" height="176" rx="1.75" fill="#ffffff" opacity="0.16"/>
    <rect x="100" y="34" width="16" height="188" rx="8" fill="url(#steel)"/>
    <rect x="103.5" y="40" width="3.5" height="176" rx="1.75" fill="#ffffff" opacity="0.16"/>
    <rect x="144" y="34" width="16" height="188" rx="8" fill="url(#steel)"/>
    <rect x="147.5" y="40" width="3.5" height="176" rx="1.75" fill="#ffffff" opacity="0.16"/>
    <rect x="188" y="34" width="16" height="188" rx="8" fill="url(#steel)"/>
    <rect x="191.5" y="40" width="3.5" height="176" rx="1.75" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- top and bottom rails -->
  <rect x="34" y="34" width="188" height="14" rx="7" fill="url(#steel)"/>
  <rect x="34" y="208" width="188" height="14" rx="7" fill="url(#steel)"/>
</svg>
